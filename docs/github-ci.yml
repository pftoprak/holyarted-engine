# Copy to .github/workflows/ci.yml (needs a GitHub token with the "workflow" scope, or add it in the GitHub web editor).
name: CI

on:
  pull_request:
  push:
    branches: [clean-skeleton]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # Fails if any paid text reaches the browser bundle.
      - run: pnpm check:bundle
      - run: pnpm lint
